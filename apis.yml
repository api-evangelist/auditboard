aid: auditboard
name: AuditBoard
description: >-
  AuditBoard (rebranded in 2026 as Optro) is an AI-powered GRC (governance, risk,
  and compliance) SaaS platform used by more than half of the Fortune 500 to run
  their audit, risk, and compliance programs. Its connected-risk suite spans
  Controls Management (SOX), OpsAudit (operational/internal audit), RiskOversight
  (enterprise/operational risk), CrossComply (IT risk and cybersecurity
  compliance), ESG, RegComply (regulatory compliance), and AI Governance. Optro
  exposes a developer platform at developer.auditboard.com (a login-gated ReadMe
  portal) for programmatic access, plus documented integrations with systems such
  as ServiceNow, Workiva, and Microsoft 365. AuditBoard was surfaced as a Battery
  Ventures portfolio company and enriched here from its public web surface; the
  API reference itself sits behind an end-user login, so no public OpenAPI is
  captured.
